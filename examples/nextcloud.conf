# Drop-in for publishing the list on a Nextcloud share. Install as
# /etc/systemd/system/update-blocklist.service.d/nextcloud.conf and adjust the
# paths: the Nextcloud data directory (holds the list) and config directory
# (occ refuses to run without write access to it, and still exits with 0).
# User= and Group= in update-blocklist.service must be the web server user,
# as occ has to run as that user.
[Service]
ReadWritePaths=/srv/www/nextcloud/data /srv/www/nextcloud/config
