# Configuration for the blocklist script of blocklist-updater
#
# Every [section] other than [global] is a blocklist source. A source is
# switched on by enabling its timer and off by disabling it:
#   systemctl enable --now update-blocklist@<section>.timer
#   systemctl disable --now update-blocklist@<section>.timer
# A disabled source drops out of the published list once its spool file is
# older than max_age_days. To drop it immediately, delete
# /var/spool/blocklists/<section>.txt and run: systemctl start update-blocklist.service
#
# Source keys:
#   url             download URL
#   format          plain         one IP/CIDR per line, '#' and ';' start comments
#                   spamhaus-json Spamhaus DROP JSON (one object per line)
#                   dshield       DShield block.txt (start, end, prefix columns)
#   headers         extra HTTP headers, one per line (indented continuation lines)
#   key_credential  systemd credential holding an API key, sent as "Key: <value>"
#                   (see update-blocklist@abuseipdb.service.d/credential.conf)
#   min_entries     fewer valid entries means the download is treated as broken
#   max_age_days    older spool files are left out of the published list

[global]
spool_dir = /var/spool/blocklists
output = /srv/www/nextcloud/data/admin/files/iplist.txt
# run after the published list changed, so the Nextcloud share serves the new file
post_publish = /usr/bin/php /srv/www/nextcloud/occ files:scan --quiet --no-interaction -p /admin/files/iplist.txt
# never publish these: own addresses and networks, e.g. the ignoreip of
# fail2ban. The examples are documentation addresses, replace them. Ranges
# from providers that contain one of these are split around it. Private and
# reserved networks are always excluded.
never_block = 192.0.2.10 198.51.100.0/24
# reject entries broader than these prefixes (a /1 would block half the internet)
min_prefix_v4 = 8
min_prefix_v6 = 19
# refuse to publish a list that shrank by more than this compared to the
# published one (protects against broken downloads); override with --force
max_shrink_percent = 30
default_max_age_days = 3
default_min_entries = 10

# --- sources -----------------------------------------------------------------

[spamhaus-drop]
# hijacked and criminal netblocks, IPv4; EDROP was merged into this list in 2024
url = https://www.spamhaus.org/drop/drop.txt
format = plain

[spamhaus-drop-v6]
url = https://www.spamhaus.org/drop/drop_v6.json
format = spamhaus-json

[gpf]
url = https://www.gpf-comics.com/dnsbl/export.php?export_type=text&submit=Export
format = plain

[abuseipdb]
# free plan: 5 blacklist downloads per day, at most 10,000 IPs
url = https://api.abuseipdb.com/api/v2/blacklist?confidenceMinimum=90
format = plain
headers = Accept: text/plain
key_credential = abuseipdb-key
max_age_days = 2

# --- more sources ------------------------------------------------------------

[blocklist-de]
# IPs reported by fail2ban users (ssh, mail, apache, ...) within the last 48 h
url = https://lists.blocklist.de/lists/all.txt
format = plain
max_age_days = 2

[cinsscore]
# CINS Army: IPs with poor reputation in the Sentinel IPS network
url = https://cinsscore.com/list/ci-badguys.txt
format = plain

[et-compromised]
# Emerging Threats (Proofpoint): known compromised hosts
url = https://rules.emergingthreats.net/blockrules/compromised-ips.txt
format = plain

[greensnow]
url = https://blocklist.greensnow.co/greensnow.txt
format = plain

[dshield]
# SANS DShield: top 20 attacking /24 networks of the last 3 days
url = https://feeds.dshield.org/block.txt
format = dshield
min_entries = 5
